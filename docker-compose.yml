services:
  nginx:
    image: nginx:alpine
    container_name: portfolio_nginx
    ports:
      - "8080:80"
    volumes:
      - ./server:/var/www/server
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      - client
    networks:
      - portfolio_network
  
  server:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: portfolio_server
    volumes:
      - ./server:/var/www/server
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - postgres
    networks:
      - portfolio_network

  client:
    build:
      context: ./client
      dockerfile: ../docker/client/Dockerfile
    container_name: portfolio_client
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - portfolio_network

  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - portfolio_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: portfolio_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:
      PGADMIN_DEFAULT_PASSWORD:
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - portfolio_network
      
networks:
  portfolio_network:
    driver: bridge

volumes:
  pgdata:
  