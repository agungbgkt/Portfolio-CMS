# Konfigurasi reverse proxy untuk
server {
    listen 80;
    server_name localhost;
    root /var/www/server/public;

    client_max_body_size 10M;

    # 1. Routing API ke Laravel (PHP-FPM)
    location ^~ /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. Routing file upload (gambar proyek & sertifikat)
    location ^~ /storage {
        alias /var/www/server/public/storage/;
        access_log off;
        expires 7d;
    }

    # Eksekusi script PHP manual container 'server'
    location ~ \.php$ {
        fastcgi_pass server:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 3. Routing sisanya ke React + Vite (Client)
    location / {
        proxy_pass http://client:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}